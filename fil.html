<!DOCTYPE html>
<!--
  Fichier : fil.html
  Rôle    : page du fil d'actualité de Loby (réservée aux utilisateurs connectés) : formulaire de publication
            et liste des posts de tous les comptes, du plus récent au plus ancien.
  Membre  : Membre 3 (fil d'actualité et interface)
-->
<html lang="fr">
<head>
  <!-- Encodage des caractères : doit être la toute première balise pour bien afficher les accents. -->
  <meta charset="UTF-8">

  <!--
    SÉCURITÉ : Content-Security-Policy (CSP). Liste blanche de ce que la page a le droit de charger.
    Si un attaquant réussit à injecter du code dans la page (attaque XSS), le navigateur refusera de l'exécuter.
    - default-src 'self' : par défaut, uniquement des fichiers venant de notre propre site.
    - script-src 'self' : scripts seulement depuis nos fichiers .js (aucun <script> inline, aucun onclick, pas d'eval).
    - style-src 'self'  : styles seulement depuis css/style.css (aucun attribut style="..." ni <style>).
    - img-src 'self'    : images seulement depuis notre site (pas d'image piégée chargée ailleurs).
    - object-src 'none' : aucun plugin (<object>, <embed>), souvent utilisés pour exécuter du code.
    - base-uri 'self'   : empêche d'injecter une balise <base> qui détournerait tous nos chemins relatifs.
    - form-action 'self': les formulaires ne peuvent envoyer leurs données que vers notre site (pas de vol de données).
    Placée juste après charset pour s'appliquer avant le chargement de toute autre ressource.
  -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">

  <!-- Adapte l'affichage à la largeur de l'écran (téléphones). -->
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- SÉCURITÉ : n'envoie jamais l'adresse de notre page aux autres sites (fuite d'informations via l'en-tête Referer). -->
  <meta name="referrer" content="no-referrer">

  <title>Loby — Fil d'actualité</title>

  <!-- Icônes du site (chemins RELATIFS : le site est publié dans un sous-dossier sur GitHub Pages). -->
  <!-- Icône de l'onglet en SVG : nette à toutes les tailles (navigateurs récents). -->
  <link rel="icon" href="assets/favicon/favicon.svg" type="image/svg+xml">
  <!-- Solution de secours pour les navigateurs qui ne lisent pas le SVG. -->
  <link rel="icon" href="assets/favicon/favicon.ico" sizes="48x48">
  <!-- Icône quand on ajoute le site à l'écran d'accueil d'un iPhone. -->
  <link rel="apple-touch-icon" href="assets/favicon/apple-touch-icon.png">
  <!-- Fiche d'identité du site (nom + icônes Android). -->
  <link rel="manifest" href="assets/favicon/site.webmanifest">
  <!-- Couleur de la barre du navigateur sur mobile (couleur principale de Loby). -->
  <meta name="theme-color" content="#2F54EB">

  <!-- Feuille de style externe (les styles inline sont interdits par la CSP). -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="en-tete en-tete--fil">
    <img src="assets/logo/loby-horizontal-bleu.svg" alt="Loby" height="40">
    <div class="utilisateur">
      <!-- Pseudo de l'utilisateur connecté, écrit en JS avec textContent (fil.js). -->
      <span id="pseudo-connecte" class="utilisateur-pseudo"></span>
      <button type="button" id="bouton-deconnexion" class="bouton bouton--secondaire">Se déconnecter</button>
    </div>
  </header>

  <main class="contenu">
    <h1 class="titre-cache">Fil d'actualité</h1>

    <!-- Formulaire de publication. -->
    <section class="carte">
      <!--
        SÉCURITÉ : validation HTML (required, maxlength="280"), revérifiée en JavaScript (validation.js)
        car ces attributs se contournent avec F12. Pas d'attribut "action" : l'envoi est géré en JS (fil.js).
      -->
      <form id="formulaire-post" class="formulaire">
        <label for="texte-post">Quoi de neuf ?</label>
        <textarea id="texte-post" name="texte" rows="3" required maxlength="280"></textarea>
        <div class="formulaire-pied">
          <!-- Compteur de caractères restants, mis à jour à chaque frappe (fil.js). -->
          <span id="compteur" class="compteur" aria-live="polite"></span>
          <button type="submit" class="bouton bouton--principal">Publier</button>
        </div>
        <p id="message-publication" class="message-erreur" aria-live="polite"></p>
      </form>
    </section>

    <!-- Le fil : les posts sont construits en JS avec createElement + textContent (jamais innerHTML). -->
    <section aria-labelledby="titre-fil">
      <h2 id="titre-fil" class="titre-section">Fil</h2>
      <p id="message-fil" class="message-erreur" aria-live="polite"></p>
      <div id="liste-posts"></div>
    </section>
  </main>

  <!--
    SÉCURITÉ : scripts uniquement dans des fichiers .js séparés (aucun <script> inline), seul cas autorisé
    par la CSP (script-src 'self'). Placés en fin de page pour que les éléments existent déjà.
    fil.js vérifie la session dès son chargement et redirige vers index.html si personne n'est connecté.
  -->
  <script src="js/stockage.js"></script>
  <script src="js/validation.js"></script>
  <script src="js/posts.js"></script>
  <script src="js/fil.js"></script>
</body>
</html>
