<!DOCTYPE html>
<!--
  Fichier : index.html
  Rôle    : page d'accueil de Loby, avec les formulaires « Créer un compte » et « Se connecter ».
            Après une inscription ou une connexion réussie, on est redirigé vers fil.html.
  Membre  : Membre 4 (en-têtes de sécurité) et Membre 1 (formulaires de comptes)
-->
<html lang="fr">
<head>
  <!-- Encodage des caractères : doit être la toute première balise pour bien afficher les accents. -->
  <meta charset="UTF-8">

  <!--
    SÉCURITÉ : Content-Security-Policy (CSP). Liste blanche de ce que la page a le droit de charger.
    Si un attaquant réussit à injecter du code dans la page (attaque XSS), le navigateur refusera de l'exécuter.
    - default-src 'self' : par défaut, uniquement des fichiers venant de notre propre site.
    - script-src 'self' : scripts seulement depuis nos fichiers .js (aucun <script> inline, aucun onclick, pas d'eval).
    - style-src 'self'  : styles seulement depuis css/style.css (aucun attribut style="..." ni <style>).
    - img-src 'self'    : images seulement depuis notre site (pas d'image piégée chargée ailleurs).
    - object-src 'none' : aucun plugin (<object>, <embed>), souvent utilisés pour exécuter du code.
    - base-uri 'self'   : empêche d'injecter une balise <base> qui détournerait tous nos chemins relatifs.
    - form-action 'self': les formulaires ne peuvent envoyer leurs données que vers notre site (pas de vol d'identifiants).
    Placée juste après charset pour s'appliquer avant le chargement de toute autre ressource.
  -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">

  <!-- Adapte l'affichage à la largeur de l'écran (téléphones). -->
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- SÉCURITÉ : n'envoie jamais l'adresse de notre page aux autres sites (fuite d'informations via l'en-tête Referer). -->
  <meta name="referrer" content="no-referrer">

  <title>Loby — Connexion</title>

  <!-- Icônes du site (chemins RELATIFS : le site est publié dans un sous-dossier sur GitHub Pages). -->
  <!-- Icône de l'onglet en SVG : nette à toutes les tailles (navigateurs récents). -->
  <link rel="icon" href="assets/favicon/favicon.svg" type="image/svg+xml">
  <!-- Solution de secours pour les navigateurs qui ne lisent pas le SVG. -->
  <link rel="icon" href="assets/favicon/favicon.ico" sizes="48x48">
  <!-- Icône quand on ajoute le site à l'écran d'accueil d'un iPhone. -->
  <link rel="apple-touch-icon" href="assets/favicon/apple-touch-icon.png">
  <!-- Fiche d'identité du site (nom + icônes Android). -->
  <link rel="manifest" href="assets/favicon/site.webmanifest">
  <!-- Couleur de la barre du navigateur sur mobile (couleur principale de Loby). -->
  <meta name="theme-color" content="#2F54EB">

  <!-- Feuille de style externe (les styles inline sont interdits par la CSP). -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="en-tete">
    <img src="assets/logo/loby-horizontal-bleu.svg" alt="Loby" height="40">
  </header>

  <main class="contenu contenu--accueil">
    <h1 class="accroche">Partagez vos idées en 280 caractères.</h1>

    <div class="grille-formulaires">
      <!-- Formulaire d'inscription. -->
      <section class="carte">
        <h2 class="carte-titre">Créer un compte</h2>
        <!--
          SÉCURITÉ : validation HTML (required, minlength, maxlength, pattern). Première barrière contre
          les saisies hors règles ; elle est revérifiée en JavaScript (validation.js) car elle se contourne avec F12.
          Pas d'attribut "action" : l'envoi est géré en JS (comptes.js), les données ne quittent jamais le navigateur.
        -->
        <form id="formulaire-inscription" class="formulaire">
          <label for="inscription-pseudo">Pseudo</label>
          <input type="text" id="inscription-pseudo" name="pseudo"
                 required minlength="3" maxlength="20" pattern="[A-Za-z0-9_]{3,20}" autocomplete="username">
          <p class="aide">3 à 20 caractères : lettres sans accent, chiffres ou _</p>

          <label for="inscription-mot-de-passe">Mot de passe</label>
          <!-- autocomplete="new-password" : le gestionnaire de mots de passe propose un mot de passe fort. -->
          <input type="password" id="inscription-mot-de-passe" name="mot-de-passe"
                 required minlength="8" maxlength="64" autocomplete="new-password">
          <p class="aide">8 à 64 caractères</p>

          <!-- Zone des messages d'erreur (remplie en JS avec textContent). aria-live : lue par les lecteurs d'écran. -->
          <p id="message-inscription" class="message-erreur" aria-live="polite"></p>
          <button type="submit" id="bouton-inscription" class="bouton bouton--principal">Créer mon compte</button>
        </form>
      </section>

      <!-- Formulaire de connexion. -->
      <section class="carte">
        <h2 class="carte-titre">Se connecter</h2>
        <!-- SÉCURITÉ : mêmes règles HTML que l'inscription, revérifiées en JavaScript. -->
        <form id="formulaire-connexion" class="formulaire">
          <label for="connexion-pseudo">Pseudo</label>
          <input type="text" id="connexion-pseudo" name="pseudo"
                 required minlength="3" maxlength="20" pattern="[A-Za-z0-9_]{3,20}" autocomplete="username">

          <label for="connexion-mot-de-passe">Mot de passe</label>
          <input type="password" id="connexion-mot-de-passe" name="mot-de-passe"
                 required minlength="8" maxlength="64" autocomplete="current-password">

          <p id="message-connexion" class="message-erreur" aria-live="polite"></p>
          <button type="submit" id="bouton-connexion" class="bouton bouton--principal">Se connecter</button>
        </form>
      </section>
    </div>
  </main>

  <!--
    SÉCURITÉ : scripts uniquement dans des fichiers .js séparés (aucun <script> inline), seul cas autorisé
    par la CSP (script-src 'self'). Placés en fin de page pour que les formulaires existent déjà.
    L'ordre compte : chaque fichier utilise les fonctions des fichiers chargés avant lui.
  -->
  <script src="js/stockage.js"></script>
  <script src="js/validation.js"></script>
  <script src="js/hachage.js"></script>
  <script src="js/comptes.js"></script>
</body>
</html>
